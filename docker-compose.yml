services:
  postgres:
    image: postgres:17
    container_name: postgres
    restart: "no"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  rabbitmq:
    image: rabbitmq:4-management
    container_name: notifyflow-rabbitmq
    restart: no
    environment:
      RABBITMQ_DEFAULT_USER: notifyflow
      RABBITMQ_DEFAULT_PASS: notifyflow
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  mailpit:
    image: axllent/mailpit:latest
    container_name: notifyflow-mailpit
    restart: no
    ports:
      - "1025:1025"
      - "8025:8025"
volumes:
  postgres_data:
  rabbitmq_data:
